name: Publish Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing MactoyThemer.zip
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sparkle-appcast-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  appcast:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the pinned Sparkle tools
        run: >-
          xcodebuild -resolvePackageDependencies
          -project MactoyThemer.xcodeproj -scheme MactoyThemer
          -derivedDataPath "$RUNNER_TEMP/sparkle-build"
          -onlyUsePackageVersionsFromResolvedFile
      - name: Sign the update and attach its appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_BIN: ${{ runner.temp }}/sparkle-build/SourcePackages/artifacts/sparkle/Sparkle/bin
        run: bash scripts/publish-appcast.sh
